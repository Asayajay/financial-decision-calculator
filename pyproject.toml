[project]
name = "findcalc"
version = "0.1.0"
description = "Transparent calculators for lease-vs-buy, debt-vs-invest, and job-offer-across-locations decisions"
requires-python = ">=3.10"

[project.scripts]
findcalc = "findcalc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
